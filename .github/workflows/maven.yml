name: Build BedWars Cosmetics

on:
  push:
    branches: [ "main", "master", "dev", "development" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # --- DODANO TEN KROK ---
      # Tworzy plik settings.xml, który odblokowuje repozytorium HTTP
      - name: Create Maven settings.xml (Allow HTTP)
        run: |
          cat <<EOF > settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                  <mirror>
                      <id>allow-screaming-http</id>
                      <mirrorOf>screaming-repo</mirrorOf>
                      <url>http://repo.screamingsandals.org/public/</url>
                      <blocked>false</blocked>
                  </mirror>
              </mirrors>
          </settings>
          EOF

      # --- ZMODYFIKOWANO TEN KROK ---
      # Dodano flagę "-s settings.xml", aby Maven użył naszej konfiguracji
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml -DskipTests -s settings.xml

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWars-Cosmetics-Jar
          path: build/*.jar
          if-no-files-found: error
