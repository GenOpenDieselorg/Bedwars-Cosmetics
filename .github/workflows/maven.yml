name: Build BedWars Cosmetics

on:
  push:
    branches: [ "main", "master", "dev", "development" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie budowania przyciskiem

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ustawiamy Javę 21 (zgodnie z logami serwera, na którym testowałeś)
      # Możesz zmienić na 17 lub 11, jeśli wolisz.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Budowanie projektu i tworzenie paczki (skip tests przyspiesza build)
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml -DskipTests

      # Wyszukiwanie i przesyłanie gotowego pliku .jar jako artefaktu
      # Zgodnie z Twoim pom.xml, gotowy plik ląduje w folderze "build" w głównym katalogu
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedWars-Cosmetics-Jar
          path: build/*.jar
          if-no-files-found: error
